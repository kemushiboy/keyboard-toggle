name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        shell: cmd
        run: src\build.bat

      - name: Package
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { $env:SHA.Substring(0, 7) }
          $name = "LaptopInputLock-$version"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item LaptopInputLock.exe, 'Toggle Input Lock.bat', 'Detect Devices.bat', devices.example.txt, README.md, README.ja.md, LICENSE, SECURITY.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Copy-Item LaptopInputLock.exe dist/
          Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Remove-Item "dist/$name" -Recurse

      - uses: actions/upload-artifact@v7
        with:
          name: LaptopInputLock
          path: dist/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # sign the build provenance attestation
      attestations: write   # store the attestation
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: LaptopInputLock
          path: dist/

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
